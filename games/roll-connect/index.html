<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174e4f">
<meta name="description" content="Roll & Connect — a two-player dice race. Works offline.">
<title>Roll &amp; Connect — Scorepad</title>
<style>
:root{--bg:#174e4f;--dark:#103b3c;--ink:#202d2a;--muted:#58645e;--paper:#fffefa;--line:#dfe8e2;--gold:#e6b75a;--a:#8f3d5f;--b:#9a6a17}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#edf2ed;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}
header{flex:0 0 54px;background:var(--bg);color:#fff;padding:6px 14px;box-shadow:0 3px 12px #103b3c22}
.head{height:100%;max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.home{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:6px 10px;border-radius:9px;font-weight:750;font-size:.82rem;white-space:nowrap}
h1{font-size:clamp(1.15rem,3vw,1.65rem);margin:0;letter-spacing:-.04em}
.offline{font-size:.65rem;font-weight:800;border:1px solid #ffffff55;border-radius:30px;padding:6px 9px;white-space:nowrap}
main{width:min(100%,1100px);height:calc(100dvh - 54px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:0;margin:0 auto;padding:10px 14px 12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px}
.setup{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.player{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 10px;background:var(--paper);border-radius:12px;border:1px solid var(--line)}
.player.b{flex-direction:row-reverse;text-align:right}
.player-mark{width:10px;height:30px;border-radius:8px;flex:0 0 10px;background:var(--a)}.player.b .player-mark{background:var(--b)}
.player input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-weight:850;font-size:clamp(.78rem,2.2vw,1rem);padding:3px}
.progress{font-size:.72rem;color:var(--muted);font-weight:750;white-space:nowrap}
.vs{font-size:.68rem;color:var(--muted);font-weight:900}
.game-area{min-height:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:18px;border:1px solid var(--line);box-shadow:0 7px 20px #103b3c0c;overflow:hidden;padding:5px}
.board-wrap{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#f6f2e7 0,#fffefa 70%);border-radius:13px}
svg{display:block;width:100%;height:100%;max-width:900px;touch-action:manipulation}
.player-label{font-size:12px;font-weight:850;fill:var(--ink)}.node-text{font-size:15px;font-weight:900;fill:#26352f;dominant-baseline:middle;text-anchor:middle}
.node{fill:#fff;stroke-width:2.5}.node.done.a{fill:#f8e8ef;stroke:var(--a)}.node.done.b{fill:#fbf0d9;stroke:var(--b)}
.connection{fill:none;stroke-width:4;stroke-linecap:round;opacity:.85}.connection.a{stroke:var(--a)}.connection.b{stroke:var(--b)}
.center{fill:#174e4f;stroke:#e6b75a;stroke-width:4}.center-text{fill:white;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:middle}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.status{min-width:0;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 12px}
.die{width:46px;height:46px;flex:0 0 46px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:1.9rem;font-weight:900;box-shadow:0 3px 0 #dce4de}
.status-copy{min-width:0}.status-copy strong{display:block;font-size:clamp(.78rem,2.2vw,1rem);line-height:1.2}.status-copy span{display:block;font-size:.73rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.message{font-size:.7rem;color:#285540;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.message.warn{color:#795316}.message.win{color:#17633d}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;background:var(--bg);color:#fff;min-height:42px;white-space:nowrap;font-size:.82rem}
.btn.secondary{background:#eaf1ec;color:var(--bg)}.btn.warn{background:#fff1e8;color:#8b4e1b}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:600px){
header{flex-basis:48px;padding:5px 9px}.offline{display:none}
main{height:calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:7px;gap:7px}
.setup{gap:5px}.player{padding:6px 7px;gap:5px}.player-mark{height:25px;width:7px;flex-basis:7px}.progress{font-size:.65rem}.vs{font-size:.6rem}
.game-area{border-radius:14px;padding:3px}.board-wrap{border-radius:10px}
.bottom{grid-template-columns:1fr;gap:6px}.status{padding:6px 9px;gap:8px}.die{width:38px;height:38px;flex-basis:38px;font-size:1.55rem}
.status-copy span{font-size:.68rem}.message{font-size:.66rem}
.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.btn{min-height:38px;padding:8px 7px;font-size:.74rem}
}
@media(max-height:620px) and (min-width:601px){
header{flex-basis:44px}main{height:calc(100dvh - 44px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:5px 10px;gap:5px}
.player{padding:4px 8px}.status{padding:5px 9px}.die{width:36px;height:36px;flex-basis:36px}.btn{min-height:36px;padding:7px 10px}
}
@media(orientation:landscape) and (max-height:500px){
header{flex-basis:40px}main{height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);gap:6px;padding:5px 9px}
.setup{grid-column:1/-1}.game-area{grid-column:1;grid-row:2}.bottom{grid-column:2;grid-row:2;width:min(34vw,260px);display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.status{flex-direction:column;align-items:center;text-align:center}.status-copy span{white-space:normal}.controls{display:grid;grid-template-columns:1fr}.btn{width:100%}
}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .12s ease}.btn:active{transform:scale(.98)}.connection{animation:draw .35s ease-out}@keyframes draw{from{stroke-dasharray:0 500}to{stroke-dasharray:500 0}}}
</style>
</head>
<body>
<header><div class="head"><a class="home" href="../../index.html">← Home</a><h1>Roll &amp; Connect</h1><span class="offline">● OFFLINE · AUTO-SAVE</span></div></header>
<main>
<div class="setup">
 <div class="player a"><span class="player-mark"></span><input id="nameA" maxlength="18" value="Player 1" aria-label="Player 1 name"><span class="progress" id="statA">0/6</span></div>
 <span class="vs">VS</span>
 <div class="player b"><span class="progress" id="statB">0/6</span><input id="nameB" maxlength="18" value="Player 2" aria-label="Player 2 name"><span class="player-mark"></span></div>
</div>
<section class="game-area">
<div class="board-wrap">
<svg id="board" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two-player board with six numbered circles on each side connected to a central goal">
<text x="70" y="17" text-anchor="middle" class="player-label" id="labelA">PLAYER 1</text>
<text x="290" y="286" text-anchor="middle" class="player-label" id="labelB">PLAYER 2</text>
<g id="linesA"></g><g id="linesB"></g>
<circle class="center" cx="180" cy="150" r="27"></circle><text class="center-text" x="180" y="150">GOAL</text>
<g id="nodesA"></g><g id="nodesB"></g>
</svg>
</div>
</section>
<div class="bottom">
<div class="status">
 <div class="die" id="die" aria-label="Dice result">⚄</div>
 <div class="status-copy"><strong id="turnName">Player 1's turn</strong><span id="rollDescription">Roll the dice to connect a number.</span><div class="message" id="message" role="status" aria-live="polite">Player 1 starts. Good luck!</div></div>
</div>
<div class="controls">
 <button class="btn" id="roll" type="button">🎲 Roll</button>
 <button class="btn secondary" id="undo" type="button">Undo</button>
 <button class="btn secondary" id="newGame" type="button">New game</button>
</div>
</div>
</main>
<script>
(() => {
'use strict';
const KEY='scorepad.rollConnect.v1';
const positionsA=[1,2,3,4,5,6].map((n)=>({n,x:62,y:40+(n-1)*44}));
const positionsB=[1,2,3,4,5,6].map((n)=>({n,x:298,y:40+(n-1)*44}));
const $=id=>document.getElementById(id);
const empty=()=>({names:['Player 1','Player 2'],connected:[[],[]],turn:0,history:[],lastRoll:null,winner:null});
let state=empty();
const dice=['⚀','⚁','⚂','⚃','⚄','⚅'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){}}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function name(i){return state.names[i]||('Player '+(i+1));}
function makeNodes(target,positions,player){
$(target).innerHTML=positions.map(p=>'<g><circle class="node '+(state.connected[player].includes(p.n)?'done '+(player===0?'a':'b'):'')+'" cx="'+p.x+'" cy="'+p.y+'" r="17"></circle><text class="node-text" x="'+p.x+'" y="'+p.y+'">'+p.n+'</text></g>').join('');
}
function makeLines(target,positions,player){
$(target).innerHTML=state.connected[player].map(n=>{const p=positions.find(v=>v.n===n);return '<line class="connection '+(player===0?'a':'b')+'" x1="'+p.x+'" y1="'+p.y+'" x2="180" y2="150"></line>';}).join('');
}
function render(){
$('nameA').value=state.names[0];$('nameB').value=state.names[1];
$('labelA').textContent=name(0).toUpperCase();$('labelB').textContent=name(1).toUpperCase();
makeLines('linesA',positionsA,0);makeLines('linesB',positionsB,1);makeNodes('nodesA',positionsA,0);makeNodes('nodesB',positionsB,1);
$('statNameA').textContent=name(0);$('statNameB').textContent=name(1);
$('statA').textContent=state.connected[0].length+'/6';$('statB').textContent=state.connected[1].length+'/6';
$('turnName').textContent=state.winner!==null?name(state.winner)+' wins!':name(state.turn)+"'s turn";
$('rollDescription').textContent=state.winner!==null?'Game complete — start a new game.':'Roll to connect your number to the centre.';

$('roll').disabled=state.winner!==null;$('undo').disabled=state.history.length===0;
$('roll').textContent=state.winner!==null?'Finished':'🎲 Roll';
if(state.lastRoll!==null){$('die').textContent=dice[state.lastRoll-1];}else{$('die').textContent='⚄';}
if(state.winner!==null){$('rollTitle').textContent='Game complete';$('rollDescription').textContent=name(state.winner)+' connected all six numbers.';}
else{$('rollTitle').textContent=state.lastRoll?'Last roll: '+state.lastRoll:'Ready to roll?';$('rollDescription').textContent='Take turns. Each player has their own 1–6.';}
save();
}
function message(text,kind=''){const el=$('message');el.textContent=text;el.className='message'+(kind?' '+kind:'');}
function snapshot(){return JSON.parse(JSON.stringify({names:state.names,connected:state.connected,turn:state.turn,lastRoll:state.lastRoll,winner:state.winner}));}
function roll(){
if(state.winner!==null)return;
state.history.push(snapshot());
const result=Math.floor(Math.random()*6)+1;state.lastRoll=result;
const player=state.turn,already=state.connected[player].includes(result);
if(already){
message(name(player)+' rolled '+result+' again — turn skipped.','warn');
state.turn=1-player;
}else{
state.connected[player].push(result);
if(state.connected[player].length===6){state.winner=player;message(name(player)+' wins! All six connected.','win');}
else{message(name(player)+' connected '+result+' to the centre.');state.turn=1-player;}
}
render();
}
function pass(){
if(state.winner!==null)return;
state.history.push(snapshot());message(name(state.turn)+' passed the turn.','warn');state.turn=1-state.turn;render();
}
function undo(){
if(!state.history.length)return;
const previous=state.history.pop();state.names=previous.names;state.connected=previous.connected;state.turn=previous.turn;state.lastRoll=previous.lastRoll;state.winner=previous.winner;message('Last turn undone.');render();
}
function newGame(){
if(!confirm('Start a new game? Current progress will be cleared.'))return;
const names=[state.names[0],state.names[1]];state=empty();state.names=names;message(name(0)+' starts. Good luck!');render();
}
$('roll').addEventListener('click',roll);$('undo').addEventListener('click',undo);$('newGame').addEventListener('click',newGame);

['nameA','nameB'].forEach((id,i)=>$(id).addEventListener('change',e=>{state.names[i]=e.target.value.trim()||('Player '+(i+1));render();}));
try{
const raw=localStorage.getItem(KEY);
if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed.names)&&parsed.names.length===2&&Array.isArray(parsed.connected)&&parsed.connected.length===2&&parsed.connected.every(a=>Array.isArray(a)&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=6))&&[0,1].includes(parsed.turn)){state={...empty(),...parsed};state.connected=parsed.connected.map(a=>[...new Set(a)]);state.history=Array.isArray(parsed.history)?parsed.history:[];}}
}catch(_){state=empty();}
render();
})();
</script>
<script>
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('../../sw.js').catch(()=>{}));}
</script>
</body></html>
