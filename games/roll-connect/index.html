<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174e4f"><title>Roll &amp; Connect — Scorepad</title>
<style>
:root{color-scheme:light;--teal:#174e4f;--ink:#20312c;--muted:#66746d;--paper:#fffefa;--line:#dce6df;--pink:#a34569;--amber:#a77520}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#edf2ed}body{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{height:52px;flex:none;background:var(--teal);color:white;display:flex;align-items:center;padding:0 14px}.head{width:min(1080px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:white;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:6px 10px;font-size:.82rem;font-weight:750}h1{font-size:clamp(1.1rem,3vw,1.5rem);margin:0}
main{width:min(1080px,100%);margin:auto;flex:1;min-height:0;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.turnbar{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.turn-copy{min-width:0}.turn-copy strong{display:block}.turn-copy span{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}.turn-pill{border-radius:30px;padding:7px 10px;background:#e8f0eb;color:var(--teal);font-size:.72rem;font-weight:850;white-space:nowrap}
.arena{flex:1;min-height:330px;display:grid;grid-template-columns:minmax(0,1fr) 124px minmax(0,1fr);align-items:stretch;gap:10px;padding:11px;background:linear-gradient(145deg,#1e594d,#103b35);border:6px solid #96734e;border-radius:22px;box-shadow:inset 0 0 0 2px #d8b57a66,inset 0 0 28px #061b1888}
.player{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:13px 10px;background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:0 6px 15px #071d1922;transition:box-shadow .2s,border-color .2s}.player.active.p0{border-color:var(--pink);box-shadow:0 0 0 4px #a3456929}.player.active.p1{border-color:var(--amber);box-shadow:0 0 0 4px #a7752029}
.player-head{display:flex;align-items:center;gap:7px}.p1 .player-head{flex-direction:row-reverse}.marker{width:9px;height:27px;border-radius:8px;background:var(--pink);flex:none}.p1 .marker{background:var(--amber)}.player-name{width:100%;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);font-weight:850;font-size:clamp(.78rem,2vw,1rem);padding:4px 2px;outline:0}.player-name:focus{border-bottom-color:var(--teal)}.p1 .player-name{text-align:right}.count{font-size:.72rem;color:var(--muted);font-weight:800;white-space:nowrap}
.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.number{aspect-ratio:1;min-width:0;border:2px solid #dce4dd;border-radius:12px;background:linear-gradient(145deg,#fff,#f1f3ed);color:#263b33;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:900;box-shadow:0 3px 0 #d8dfd8;touch-action:none;user-select:none}.number.connected{background:#e9eee8;color:#879189;border-color:#dce4dd;box-shadow:none;text-decoration:line-through;opacity:.7}.number.highlight{border-color:var(--pink);background:#f8eaf0;color:#84334f;box-shadow:0 0 0 4px #a3456925,0 3px 0 #dfc0cc;animation:pulse .9s ease-in-out infinite}.p1 .number.highlight{border-color:var(--amber);background:#fbf1df;color:#805511;box-shadow:0 0 0 4px #a7752025,0 3px 0 #e5d4b2}@keyframes pulse{50%{transform:scale(1.045)}}
.centre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;min-width:0}.dice-button{width:104px;height:104px;border:0;border-radius:22px;background:linear-gradient(145deg,#fff,#e9eee8);box-shadow:0 8px 0 #c5d0c6,0 13px 22px #071c1877,inset 0 2px 3px white;display:grid;place-items:center}.dice-button:active{transform:translateY(3px);box-shadow:0 5px 0 #c5d0c6,0 8px 12px #071c1877}.dice-button:focus-visible,.number:focus-visible,.action:focus-visible{outline:3px solid #e6b75a;outline-offset:4px}.die{width:72px;height:72px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;padding:10px;border-radius:14px;background:linear-gradient(145deg,#fff,#e8ece6);border:1px solid #cbd5cc;box-shadow:inset 0 2px 3px #fff,0 3px 0 #c5d0c6;user-select:none}.die i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#66746d,#1d3029 78%);opacity:0}.die.face-1 i:nth-child(5),.die.face-2 i:nth-child(1),.die.face-2 i:nth-child(9),.die.face-3 i:nth-child(1),.die.face-3 i:nth-child(5),.die.face-3 i:nth-child(9),.die.face-4 i:nth-child(1),.die.face-4 i:nth-child(3),.die.face-4 i:nth-child(7),.die.face-4 i:nth-child(9),.die.face-5 i:nth-child(1),.die.face-5 i:nth-child(3),.die.face-5 i:nth-child(5),.die.face-5 i:nth-child(7),.die.face-5 i:nth-child(9),.die.face-6 i:nth-child(1),.die.face-6 i:nth-child(3),.die.face-6 i:nth-child(4),.die.face-6 i:nth-child(6),.die.face-6 i:nth-child(7),.die.face-6 i:nth-child(9){opacity:1}.dice-button.rolling .die{animation:tumble .2s linear infinite}@keyframes tumble{to{transform:rotate(360deg)}}.dice-caption{color:#f8edcf;text-align:center;font-size:.68rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.dice-help{max-width:115px;text-align:center;color:#e1eee6;font-size:.68rem;line-height:1.4}
.notice{min-height:21px;text-align:center;color:#315b47;font-size:.8rem;font-weight:750}.notice.warn{color:#805511}.notice.win{color:#17633d}.actions{display:flex;justify-content:center;gap:8px}.action{border:0;border-radius:10px;padding:9px 15px;min-height:40px;background:var(--teal);color:white;font-size:.82rem;font-weight:850}.action.light{background:#e7efe9;color:var(--teal)}.action:disabled{opacity:.42;cursor:not-allowed}
@media(max-width:680px){header{height:47px}main{padding:7px;gap:7px}.turnbar{padding:8px 10px}.turn-copy span{font-size:.69rem}.arena{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);gap:6px;padding:6px;border-width:5px;border-radius:17px;min-height:310px}.player{padding:9px 6px;gap:11px;border-radius:13px;border-width:2px}.player-head{gap:4px}.marker{width:7px;height:23px}.player-name{font-size:.74rem}.count{font-size:.63rem}.numbers{gap:5px}.number{border-radius:9px;font-size:1.05rem}.dice-button{width:68px;height:68px;border-radius:16px}.die{width:52px;height:52px;gap:3px;padding:7px;border-radius:11px}.dice-caption{font-size:.58rem;letter-spacing:.02em}.dice-help{font-size:.59rem;max-width:75px}.action{min-height:37px;padding:8px 12px;font-size:.76rem}}
@media(max-width:370px){.arena{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:4px;padding:5px}.player{padding:7px 4px}.numbers{gap:4px}.dice-button{width:58px;height:58px}.die{width:46px;height:46px;padding:6px}.player-name{font-size:.68rem}}
@media(orientation:landscape) and (max-height:520px){main{padding:5px 9px;gap:5px}.turnbar{padding:5px 10px}.arena{min-height:0;padding:5px}.player{padding:5px;gap:5px}.numbers{gap:4px}.number{max-height:62px}.dice-button{width:70px;height:70px}.die{width:52px;height:52px;padding:7px}.dice-help{display:none}.action{min-height:33px;padding:6px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<header><div class="head"><a class="home" href="../../index.html">← Home</a><h1>Roll &amp; Connect</h1><span>● Auto-save</span></div></header>
<main>
<section class="turnbar" aria-live="polite"><div class="turn-copy"><strong id="turnTitle">Player 1's turn</strong><span id="instruction">Roll the dice to get your number.</span></div><span class="turn-pill" id="turnPill">PLAYER 1</span></section>
<section class="arena" aria-label="Roll and Connect game board">
 <section class="player p0 active" id="player0" aria-label="Player 1 area"><div class="player-head"><span class="marker"></span><input class="player-name" id="name0" maxlength="18" value="Player 1" aria-label="Player 1 name"><span class="count" id="count0">0/6</span></div><div class="numbers" id="numbers0"></div></section>
 <div class="centre"><button class="dice-button" id="diceButton" type="button" aria-label="Roll the dice"><span class="die face-5" id="die" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button><div class="dice-caption">Tap to roll</div><div class="dice-help" id="diceHelp">Your number lights up. Drag it here or tap it, then tap the dice.</div></div>
 <section class="player p1" id="player1" aria-label="Player 2 area"><div class="player-head"><span class="marker"></span><input class="player-name" id="name1" maxlength="18" value="Player 2" aria-label="Player 2 name"><span class="count" id="count1">0/6</span></div><div class="numbers" id="numbers1"></div></section>
</section>
<div class="notice" id="notice" role="status" aria-live="polite">Player 1 starts. Roll the dice!</div>
<div class="actions"><button class="action light" id="undo" type="button" disabled>Undo turn</button><button class="action light" id="newGame" type="button">New game</button></div>
</main>
<script src="game-logic.js"></script>
<script>
(()=>{'use strict';
const R=window.RollConnectRules,KEY='scorepad.rollConnect.v1' ,$=id=>document.getElementById(id);
let state=R.freshState(),rolling=false,selected=null,dragging=null;
function say(t,k=''){const e=$('notice');e.textContent=t;e.className='notice'+(k?' '+k:'');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){say('Unable to save on this device.','warn');}}
function render(){
 for(let p=0;p<2;p++){
  $('name'+p).value=state.names[p];$('player'+p).classList.toggle('active',state.winner===null&&state.turn===p);$('count'+p).textContent=state.connected[p].length+'/6';
  $('numbers'+p).innerHTML=Array.from({length:6},(_,i)=>i+1).map(n=>{const done=state.connected[p].includes(n),hi=state.pendingRoll===n&&state.turn===p;return '<button type="button" class="number '+(done?'connected':'')+(hi?' highlight':'')+'" data-player="'+p+'" data-number="'+n+'" '+(done?'disabled':'')+' aria-label="'+state.names[p]+' number '+n+(done?', connected':hi?', rolled and ready to connect':'')+'">'+n+'</button>';}).join('');
 }
 $('turnTitle').textContent=state.winner!==null?state.names[state.winner]+' wins!':state.names[state.turn]+"'s turn";$('turnPill').textContent=state.winner!==null?'WINNER':'PLAYER '+(state.turn+1);
 $('instruction').textContent=state.winner!==null?'All six numbers connected. Start a new game.':state.pendingRoll!==null?'Connect '+state.pendingRoll+' to the centre dice.':'Roll the dice to get your number.';
 $('die').className='die face-'+(state.lastRoll||5);$('diceButton').disabled=rolling||state.winner!==null||(state.pendingRoll!==null&&!selected);$('diceButton').classList.toggle('rolling',rolling);
 $('diceButton').setAttribute('aria-label',state.pendingRoll!==null?'Connect number '+state.pendingRoll:'Roll dice for '+state.names[state.turn]);$('undo').disabled=rolling||!state.history.length;$('newGame').disabled=rolling;
 $('diceHelp').textContent=state.pendingRoll!==null?'Drag '+state.pendingRoll+' here, or tap the highlighted number then tap the dice.':'Each player connects their own numbers 1–6.';save();
}
function roll(){
 if(rolling||state.pendingRoll!==null||state.winner!==null)return;
 rolling=true;$('diceButton').disabled=true;$('diceButton').classList.add('rolling');say(state.names[state.turn]+' is rolling…');
 setTimeout(()=>{const r=R.roll(state,Math.floor(Math.random()*6)+1);state=r.state;rolling=false;$('diceButton').classList.remove('rolling');
  if(r.event==='duplicate')say(state.names[r.player]+' rolled '+r.value+' again. Turn passes.','warn');else say(state.names[r.player]+' rolled '+r.value+'. Connect it to the dice.');render();
 },850);
}
function connect(p,n){
 if(rolling||state.pendingRoll===null)return;const r=R.connect(state,p,n);if(r.event==='invalid'){say('Connect only the highlighted number for the current player.','warn');return;}if(r.event==='blocked')return;
 state=r.state;selected=null;if(r.event==='won')say(state.names[p]+' wins! All six connected.','win');else say(state.names[p]+' connected '+n+'. '+state.names[state.turn]+' is next.');render();
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const parsed=JSON.parse(raw);if(R.validState(parsed))state={...R.freshState(),...parsed,history:Array.isArray(parsed.history)?parsed.history:[]};}catch(_){state=R.freshState();}}
$('diceButton').addEventListener('click',()=>{if(state.pendingRoll===null)roll();else if(selected)connect(selected.player,selected.number);});
document.addEventListener('click',e=>{const b=e.target.closest('.number');if(!b||rolling)return;const p=Number(b.dataset.player),n=Number(b.dataset.number);if(state.pendingRoll===n&&state.turn===p){selected={player:p,number:n};$('diceButton').disabled=false;say('Now tap the centre dice to connect '+n+'.');}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.number.highlight');if(b&&!rolling)dragging={player:Number(b.dataset.player),number:Number(b.dataset.number)};});
document.addEventListener('pointerup',e=>{if(!dragging)return;const r=$('diceButton').getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom,d=dragging;dragging=null;if(inside)connect(d.player,d.number);});
document.addEventListener('pointercancel',()=>{dragging=null;});
$('undo').addEventListener('click',()=>{if(rolling)return;state=R.undo(state);selected=null;say('Last turn undone.');render();});
$('newGame').addEventListener('click',()=>{if(rolling||!confirm('Start a new game? Current progress will be cleared.'))return;state=R.reset(state);selected=null;say(state.names[0]+' starts. Roll the dice!');render();});
[0,1].forEach(p=>$('name'+p).addEventListener('change',e=>{state.names[p]=e.target.value.trim()||'Player '+(p+1);render();}));
load();render();
})();
</script>
<script>if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('../../sw.js').catch(()=>{}));</script>
</body></html>
